name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The harnesses drive real Chromium with SwiftShader, so the browser has
      # to be present. --with-deps pulls the shared libraries the runner lacks.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      # Boots the built game and fails on any console error or page exception.
      - name: Boot check
        run: npm run boot

      # Packages the single-file artifact and asserts it boots, hands the title
      # card over to the HUD on click, and fetches nothing outside itself.
      - name: Artifact check
        run: npm run check:artifact

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: dist-single
          path: dist-single.html
          if-no-files-found: error

      # Headless render failures are near-impossible to read from logs alone.
      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: failure-screenshots
          path: shots/*.png
          if-no-files-found: ignore

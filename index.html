<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230b0e13'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23e8eef5' stroke-width='2'/%3E%3Cpath d='M16 3v7M16 22v7M3 16h7M22 16h7' stroke='%23e8eef5' stroke-width='2'/%3E%3C/svg%3E" />
<title>GTA5mini — Three.js FPS Prototype</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #05070a; }
  body { font: 13px/1.45 ui-monospace, "SF Mono", Menlo, Consolas, monospace; color: #e8eef5; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; width: 100%; height: 100%; }

  /* ---------- HUD ---------- */
  #hud { position: fixed; inset: 0; pointer-events: none; user-select: none; }
  #hud.hidden { display: none; }

  #crosshair { position: absolute; left: 50%; top: 50%; width: 26px; height: 26px; transform: translate(-50%,-50%); }
  #crosshair i {
    position: absolute; background: #fff; opacity: .85;
    box-shadow: 0 0 2px rgba(0,0,0,.9);
    transition: transform .06s ease-out;
  }
  #crosshair i.t { left: 50%; top: 0;   width: 2px; height: 8px; margin-left: -1px; }
  #crosshair i.b { left: 50%; bottom: 0; width: 2px; height: 8px; margin-left: -1px; }
  #crosshair i.l { top: 50%; left: 0;   height: 2px; width: 8px; margin-top: -1px; }
  #crosshair i.r { top: 50%; right: 0;  height: 2px; width: 8px; margin-top: -1px; }
  #crosshair.hide i { opacity: 0; }

  #hitmarker {
    position: absolute; left: 50%; top: 50%; width: 22px; height: 22px;
    transform: translate(-50%,-50%) scale(1.6); opacity: 0;
  }
  #hitmarker svg { width: 100%; height: 100%; }
  #hitmarker.show { animation: hm .22s ease-out; }
  @keyframes hm {
    0%   { opacity: 1; transform: translate(-50%,-50%) scale(1.7); }
    100% { opacity: 0; transform: translate(-50%,-50%) scale(1.0); }
  }

  #vitals { position: absolute; left: 28px; bottom: 26px; display: flex; flex-direction: column; gap: 8px; }
  .bar { width: 220px; height: 5px; background: rgba(255,255,255,.12); border-radius: 3px; overflow: hidden; }
  .bar > div { height: 100%; width: 100%; border-radius: 3px; transition: width .18s ease-out; }
  #healthFill { background: linear-gradient(90deg,#57e08a,#9df2b8); }
  #staminaFill { background: linear-gradient(90deg,#4fa6ff,#9fd0ff); }
  #vitals .lbl { font-size: 10px; letter-spacing: .14em; opacity: .5; text-transform: uppercase; }

  #ammo { position: absolute; right: 32px; bottom: 22px; text-align: right; }
  #ammoMag { font-size: 42px; font-weight: 700; letter-spacing: -.02em; line-height: 1; text-shadow: 0 2px 12px rgba(0,0,0,.8); }
  #ammoMag.low { color: #ff7a6b; }
  #ammoReserve { font-size: 15px; opacity: .55; margin-left: 4px; }
  #weaponName { font-size: 10px; letter-spacing: .2em; opacity: .45; text-transform: uppercase; margin-top: 4px; }
  #reloading { font-size: 11px; letter-spacing: .18em; color: #ffcf5c; opacity: 0; text-transform: uppercase; margin-top: 6px; }
  #reloading.on { opacity: 1; }

  #score { position: absolute; left: 50%; top: 22px; transform: translateX(-50%); text-align: center; }
  #scoreVal { font-size: 26px; font-weight: 700; text-shadow: 0 2px 10px rgba(0,0,0,.8); }
  #scoreLbl { font-size: 10px; letter-spacing: .22em; opacity: .45; text-transform: uppercase; }

  /* Wave readout sits under the score: same column, quieter. */
  #wave { position: absolute; left: 50%; top: 62px; transform: translateX(-50%); text-align: center;
          font-size: 10px; letter-spacing: .2em; text-transform: uppercase; opacity: .55; }
  #waveLeft { margin-left: 10px; opacity: .7; }

  /* Phase banner. Centred, but held off the crosshair so it never hides the
     thing the player is aiming with. */
  #banner { position: absolute; left: 50%; top: 30%; transform: translate(-50%,-50%);
            text-align: center; pointer-events: none; transition: opacity .25s ease-out; }
  #banner.hidden { opacity: 0; }
  #bannerTitle { font-size: 34px; font-weight: 700; letter-spacing: .04em;
                 text-shadow: 0 3px 18px rgba(0,0,0,.9); }
  #bannerSub { font-size: 11px; letter-spacing: .22em; text-transform: uppercase;
               opacity: .6; margin-top: 8px; }
  #banner.warn #bannerTitle { color: #ff5a3c; }
  #banner.good #bannerTitle { color: #57e08a; }

  #damageVignette {
    position: absolute; inset: 0; opacity: 0; transition: opacity .35s ease-out;
    background: radial-gradient(ellipse at center, transparent 42%, rgba(190,20,20,.62) 100%);
  }

  #stats {
    position: absolute; left: 28px; top: 22px; font-size: 11px; line-height: 1.7;
    opacity: .5; white-space: pre; text-shadow: 0 1px 4px #000;
  }

  #floaters { position: absolute; inset: 0; overflow: hidden; }
  .floater {
    position: absolute; font-size: 15px; font-weight: 700; color: #ffe082;
    text-shadow: 0 2px 6px rgba(0,0,0,.9); animation: fl .85s ease-out forwards;
  }
  .floater.crit { color: #ff8a65; font-size: 19px; }
  @keyframes fl {
    0%   { opacity: 1; transform: translate(-50%,-50%); }
    100% { opacity: 0; transform: translate(-50%,-160%); }
  }

  /* ---------- Overlay ---------- */
  #overlay {
    position: fixed; inset: 0; display: grid; place-items: center;
    background: radial-gradient(ellipse at 50% 40%, rgba(16,22,32,.82), rgba(3,5,8,.96));
    backdrop-filter: blur(3px); cursor: pointer; z-index: 10;
  }
  #overlay.hidden { display: none; }
  .panel { text-align: center; max-width: 560px; padding: 0 28px; }
  .panel h1 { font-size: 40px; font-weight: 800; letter-spacing: -.02em; margin-bottom: 6px; }
  .panel .sub { font-size: 12px; letter-spacing: .26em; text-transform: uppercase; opacity: .45; margin-bottom: 30px; }
  .panel .cta {
    display: inline-block; padding: 13px 30px; border: 1px solid rgba(255,255,255,.28);
    border-radius: 4px; font-size: 12px; letter-spacing: .2em; text-transform: uppercase;
    margin-bottom: 30px; background: rgba(255,255,255,.05);
  }
  .keys { display: grid; grid-template-columns: auto auto; gap: 7px 18px; font-size: 12px; opacity: .62; text-align: left; justify-content: center; }
  .keys b { font-weight: 600; opacity: .95; }
  #err { margin-top: 22px; color: #ff8a80; font-size: 12px; white-space: pre-wrap; text-align: left; }
</style>
</head>
<body>
  <div id="app"></div>

  <div id="hud" class="hidden">
    <div id="damageVignette"></div>
    <div id="stats"></div>
    <div id="score"><div id="scoreVal">0</div><div id="scoreLbl">Targets Down</div></div>
    <div id="wave"><span id="waveVal">—</span><span id="waveLeft"></span></div>
    <div id="banner" class="hidden"><div id="bannerTitle"></div><div id="bannerSub"></div></div>
    <div id="crosshair"><i class="t"></i><i class="b"></i><i class="l"></i><i class="r"></i></div>
    <div id="hitmarker">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round">
        <path d="M4 4 L9 9 M20 4 L15 9 M4 20 L9 15 M20 20 L15 15"/>
      </svg>
    </div>
    <div id="floaters"></div>
    <div id="vitals">
      <div>
        <div class="lbl">Health</div>
        <div class="bar"><div id="healthFill"></div></div>
      </div>
      <div>
        <div class="lbl">Stamina</div>
        <div class="bar"><div id="staminaFill"></div></div>
      </div>
    </div>
    <div id="ammo">
      <div><span id="ammoMag">30</span><span id="ammoReserve">/ 120</span></div>
      <div id="weaponName">Carbine</div>
      <div id="reloading">Reloading</div>
    </div>
  </div>

  <div id="overlay">
    <div class="panel">
      <h1>GTA5mini</h1>
      <div class="sub">Three.js Shooter Prototype</div>
      <div class="cta">Click to Play</div>
      <div class="keys">
        <b>WASD</b><span>移動</span>
        <b>Shift</b><span>衝刺</span>
        <b>Space</b><span>跳躍</span>
        <b>Ctrl / C</b><span>蹲下</span>
        <b>Mouse</b><span>瞄準</span>
        <b>Left Click</b><span>射擊（按住連發）</span>
        <b>Right Click</b><span>ADS 機瞄</span>
        <b>R</b><span>換彈</span>
        <b>F</b><span>手電筒</span>
        <b>1 – 3</b><span>畫質：低 / 中 / 高</span>
        <b>H</b><span>環境光來源</span>
        <b>Esc</b><span>釋放滑鼠</span>
      </div>
      <div id="err"></div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
